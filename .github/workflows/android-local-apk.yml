name: Android local APK

on:
    workflow_dispatch:
    push:
        branches:
            - feat/training-schedule

permissions:
    contents: read

concurrency:
    group: android-local-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Verify and build APK
        runs-on: ubuntu-latest
        timeout-minutes: 45

        env:
            CI: 'true'
            EXPO_NO_DOTENV: '1'
            APP_LOCAL_BUILD: 'true'
            APP_NAME: Skulpt
            APP_VERSION: '1.0'
            APP_BUILD_NUMBER: ${{ github.run_number }}
            APP_BUNDLE_IDENTIFIER: app.skulpt.local
            APP_VARIANT: local
            EXPO_PUBLIC_ANALYTICS_ENABLED: 'false'
            EXPO_PUBLIC_SYNC_HOST: ''
            EXPO_PUBLIC_SENTRY_DSN: ''
            APP_SENTRY_ORGANIZATION: ''
            APP_SENTRY_PROJECT: ''
            APP_EAS_PROJECT_ID: ''

        steps:
            - name: Check out source
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify
              run: bun run verify

            - name: Generate Android project
              run: bunx expo prebuild --platform android --clean --no-install

            - name: Build standalone release APK
              working-directory: android
              run: |
                  chmod +x gradlew
                  ./gradlew assembleRelease --no-daemon

            - name: Prepare APK
              run: |
                  mkdir -p dist
                  cp android/app/build/outputs/apk/release/app-release.apk dist/Skulpt-local.apk

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: Skulpt-local-apk
                  path: dist/Skulpt-local.apk
                  if-no-files-found: error
                  retention-days: 14
